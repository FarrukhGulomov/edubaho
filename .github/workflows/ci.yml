name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  api:
    name: API — typecheck, validate & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
        working-directory: .
      - name: Prisma generate
        run: npx prisma generate
      - name: Prisma schema validate
        run: npx prisma validate
      - name: Typecheck & build
        run: npx tsc -p tsconfig.json

  api-tests:
    name: API — tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edureyting_user
          POSTGRES_PASSWORD: edureyting_secret
          POSTGRES_DB: edureyting_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
        working-directory: .
      - name: Prisma generate
        run: npx prisma generate
      - name: Run tests
        # .env.test allaqachon localhost:5432/edureyting_test va
        # localhost:6379/1'ga ko'rsatilgan — GitHub Actions service
        # konteynerlari aynan shu standart portlarda ochiladi
        run: npm test

  web:
    name: Web — typecheck, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
        working-directory: .
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com/api/v1
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_APP_NAME: BilimOn
